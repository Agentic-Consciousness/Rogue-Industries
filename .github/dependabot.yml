version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
next:
  patterns:
    - "next"
    - "eslint-config-next"
    - "@next/*"
  update-types:
    - "major"
    - "minor"
    - "patch"
      minor-patch:
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
        patterns:
          - "*"
        update-types:
          - minor
          - patch
