name: Verify

# Lint and production build. Nothing deploys and no secrets are used.
#
# pull_request runs this file from the merge commit, which the pull request
# author can change. A self-hosted runner would execute that code on the
# private machine, so this workflow stays on a GitHub-hosted runner.
# push to main and workflow_dispatch are not events an outsider can fire;
# those stay on the personal runner in verify-trusted.yml.
on:
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        # The personal runner ran the checks inside node:22-bookworm, which
        # supplies Node 22. ubuntu-latest does not pin that runtime.
        # .node-version is the same 22.23.4 the project requires.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Run the checks
        run: bash .github/scripts/verify.sh

  # Frozen-lockfile install + production build. Not a required check;
  # making it required is a separate branch-protection decision for Daniel.
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [personal-official]
    container:
      image: node:24-bookworm
      options: --init --cpus 2 --memory 6g
    timeout-minutes: 60
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # Safe CI fixtures only — no real secrets.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:9/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:9/ci
      NEXTAUTH_SECRET: ci-only-fixture-at-least-thirty-two-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Frozen install and build
        shell: bash
        run: |
          set -euo pipefail
          unset VERCEL_ENV VERCEL VERCEL_TOKEN || true
          npm ci
          npm run build
