name: Verify

# Lint and production build. Nothing deploys and no secrets are used.
#
# pull_request runs this file from the merge commit, which the pull request
# author can change. A self-hosted runner would execute that code on the
# private machine, so this workflow stays on a GitHub-hosted runner.
# push to main and workflow_dispatch are not events an outsider can fire;
# those stay on the personal runner in verify-trusted.yml.
on:
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        # The personal runner ran the checks inside node:22-bookworm, which
        # supplies Node 22. ubuntu-latest does not pin that runtime.
        # .node-version is the same 22.23.4 the project requires.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Run the checks
        run: bash .github/scripts/verify.sh
